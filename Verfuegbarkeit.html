<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Verfügbarkeit – Spielplan</title>
<style>
:root { --bg:#f1f7f7; --card:#fff; --ink:#123036; --muted:#5b7479; --line:#d5e3e4; --navy:#0f3a40; --accent:#14958a;
  --ok:#0b7a4b; --ok-bg:#d9f5e7; --no:#b42318; --no-bg:#fde4e1; --maybe:#9a6700; --maybe-bg:#fdf0c8; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c1b1e; --card:#142a2e; --ink:#e6f2f2; --muted:#93b0b4; --line:#244045; --navy:#0a2a2f; --accent:#35c2b5;
  --ok:#6ee7a8; --ok-bg:#0f3a28; --no:#ff9b91; --no-bg:#4a1b17; --maybe:#f6d36b; --maybe-bg:#443610; } }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
header { background:var(--navy); color:#fff; padding:22px 18px 18px; }
header small { color:#8de0d8; font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:.72rem; }
header h1 { margin:6px 0 4px; font-size:1.5rem; line-height:1.2; }
header p { margin:0; color:#cfe6e6; font-size:.92rem; }
main { max-width:560px; margin:0 auto; padding:16px; }
label { font-weight:800; font-size:.9rem; display:block; margin-bottom:6px; }
select#who { width:100%; padding:12px; font-size:1rem; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
#status { min-height:1.3em; margin:10px 2px; font-size:.85rem; color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
.top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.date { font-weight:800; font-size:1.02rem; }
.tag { font-size:.78rem; font-weight:800; color:var(--accent); }
.opp { margin:4px 0 12px; color:var(--muted); font-size:.92rem; }
.btns { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.btns button { padding:12px 0; font-size:1rem; font-weight:800; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--ink); }
.btns button.on[data-v="Ja"] { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
.btns button.on[data-v="Nein"] { background:var(--no-bg); border-color:var(--no); color:var(--no); }
.btns button.on[data-v="?"] { background:var(--maybe-bg); border-color:var(--maybe); color:var(--maybe); }
.hint { color:var(--muted); text-align:center; padding:24px 8px; }
h2 { font-size:.95rem; color:var(--muted); margin:18px 2px 8px; text-transform:uppercase; letter-spacing:.05em; }
</style>
</head>
<body>
<header>
  <small>Tischtennis · Union Putzleinsdorf</small>
  <h1>Meine Verfügbarkeit</h1>
  <p>Wähle deinen Namen und tippe bei jedem Spiel, ob du kannst.</p>
</header>
<main>
  <label for="who">Wer bist du?</label>
  <select id="who"><option value="">– Name wählen –</option></select>
  <div id="status"></div>
  <div id="list"></div>
</main>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw5gsMi4VDPUyiRBdDjJZfzWkebWvcOW_VOs9w-m8n6572UQuQxNXcDsYsAhprUCay8/exec';
const keyName = 'tt-spieler-name';
const $ = id => document.getElementById(id);
let names = [], games = [], name = '';
try { name = localStorage.getItem(keyName) || ''; } catch (e) {}

function setStatus(t) { $('status').textContent = t; }
function parseDate(s) {
  const m = (s || '').match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); if (!m) return null;
  let y = +m[3]; if (y < 100) y += 2000; return new Date(y, +m[2] - 1, +m[1]);
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function load() {
  setStatus('Lade …');
  try {
    const url = SCRIPT_URL + '?mode=player' + (name ? '&name=' + encodeURIComponent(name) : '');
    const d = await (await fetch(url)).json();
    if (!d || !d.games) throw new Error('bad');
    names = d.names; games = d.games;
    if (name && !names.includes(name)) name = '';
    fillNames(); render(); setStatus('');
  } catch (e) { setStatus('Keine Verbindung zur Cloud. Bitte später noch einmal versuchen.'); }
}
function fillNames() {
  $('who').innerHTML = '<option value="">– Name wählen –</option>' + names.map(n => `<option value="${esc(n)}" ${n === name ? 'selected' : ''}>${esc(n)}</option>`).join('');
}
function render() {
  const el = $('list');
  if (!name) { el.innerHTML = '<div class="hint">Bitte oben deinen Namen wählen.</div>'; return; }
    const rows = games.map(g => {
    const idx = (g.id - 1) % 27;
    return Object.assign({}, g, { d: parseDate(g.date), round: Math.floor(idx / 3) + 1, team: idx % 3 + 1, leg: g.id <= 27 ? 'Hinrunde' : 'Rückrunde' });
  }).sort((a, b) => a.id - b.id);
  if (!rows.length) { el.innerHTML = '<div class="hint">Keine Spiele gefunden.</div>'; return; }
  el.innerHTML = rows.map(g => {
    const ha = g.homeAway === 'H' ? 'Heimspiel' : g.homeAway === 'A' ? 'Auswärtsspiel' : '';
    const btn = (v, t) => `<button data-id="${g.id}" data-v="${v}" class="${g.v === v ? 'on' : ''}">${t}</button>`;
    return `<div class="card"><div class="top"><span class="date">${g.d ? esc(g.date) + (g.time ? ' · ' + esc(g.time) : '') : 'Datum folgt'}</span><span class="tag">M${g.team} · Runde ${g.round}</span></div>
      <div class="opp">gegen ${esc(g.opponent)}${ha ? ' · ' + ha : ''}</div>
      <div class="btns">${btn('Ja', 'Ja')}${btn('?', 'Evtl.')}${btn('Nein', 'Nein')}</div></div>`;
  }).join('');
}
async function save(id, v) {
  const g = games.find(x => x.id === id); if (!g) return;
  const nv = g.v === v ? '' : v; g.v = nv; render(); setStatus('Speichere …');
  try {
    const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ mode: 'player', name: name, items: [{ id: id, v: nv }] }) });
    const d = await res.json(); if (!d || !d.ok) throw new Error('bad');
    setStatus('✓ Gespeichert');
  } catch (e) { setStatus('Fehler beim Speichern – bitte noch einmal tippen.'); load(); }
}
$('who').addEventListener('change', e => { name = e.target.value; try { localStorage.setItem(keyName, name); } catch (x) {} load(); });
$('list').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) save(+b.dataset.id, b.dataset.v); });
load();
</script>
</body>
</html>
